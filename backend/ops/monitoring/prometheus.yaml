global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: rimna-api
    # Same private Docker network as the stock rimna-backend deployment.
    # For multiple hosts use private TLS endpoints and verified server certs.
    static_configs:
      - targets: ['api:8080']
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token

# Deploy behind an HTTPS reverse proxy. PostgreSQL and SMTP are managed externally.
name: rimna-backend
services:
  api:
    build: ..
    env_file: ../.env
    environment:
      PROCESS_ROLE: api
      APP_ENV: production
      LISTEN_ADDR: ':8080'
      MEDIA_DIR: /data/private-media
    ports: ['127.0.0.1:8080:8080']
    volumes: ['../private-media:/data/private-media:ro']
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    stop_grace_period: 30s
  worker:
    build: ..
    env_file: ../.env
    environment:
      PROCESS_ROLE: worker
      APP_ENV: production
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    stop_grace_period: 30s

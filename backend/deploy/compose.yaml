# Deploy behind an HTTPS reverse proxy. PostgreSQL and SMTP are managed externally.
name: rimna-backend
x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'
services:
  api:
    build: ..
    env_file: ../.env
    environment:
      PROCESS_ROLE: api
      APP_ENV: production
      LISTEN_ADDR: ':8080'
      MEDIA_DIR: /data/private-media
    ports: ['127.0.0.1:8080:8080']
    volumes: ['../private-media:/data/private-media:ro']
    restart: unless-stopped
    logging: *bounded-logs
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/readyz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    stop_grace_period: 30s
  worker:
    build: ..
    env_file: ../.env
    environment:
      PROCESS_ROLE: worker
      APP_ENV: production
    restart: unless-stopped
    logging: *bounded-logs
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    stop_grace_period: 30s
